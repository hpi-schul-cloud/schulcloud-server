
  - name: Ldap Sync CronJob
    kubernetes.core.k8s:
      kubeconfig: ~/.kube/config
      namespace: "{{ NAMESPACE }}"
      template: api-ldap-sync-full-cronjob.yml.j2
      state: "{{ 'present' if WITH_LDAP is defined and WITH_LDAP|bool else 'absent' }}"
    tags:
      - cronjob

  - name: Ldap Worker Deployment
    kubernetes.core.k8s:
      kubeconfig: ~/.kube/config
      namespace: "{{ NAMESPACE }}"
      template: api-ldap-worker-deployment.yml.j2
      state: "{{ 'present' if WITH_LDAP is defined and WITH_LDAP|bool else 'absent' }}"
    tags:
      - deployment

  - name: api worker scaled object
    kubernetes.core.k8s:
      kubeconfig: ~/.kube/config
      namespace: "{{ NAMESPACE }}"
      template: api-ldap-worker-scaled-object.yml.j2
      state: "{{ 'present' if WITH_LDAP is defined and WITH_LDAP|bool else 'absent' }}"
    when:
      - KEDA_ENABLED is defined and KEDA_ENABLED|bool
      - SCALED_API_WORKER_ENABLED is defined and SCALED_API_WORKER_ENABLED|bool
    tags:
      - keda

  - name: Add schulcloud-server-ldapsync default allow network policy
    kubernetes.core.k8s:
      kubeconfig: ~/.kube/config
      namespace: "{{ NAMESPACE }}"
      template: default-allow-networkpolicy.yml.j2
      state: "{{ 'present' if WITH_LDAP is defined and WITH_LDAP|bool else 'absent' }}"
    tags:
      - networkPolicy
